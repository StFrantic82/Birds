<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe2;--ink:#2b2a27;--muted:#7b746a;--panel:#fffaf1;--line:#e3d6bf;--accent:#1f8a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 Inter,system-ui,sans-serif}
h1,h2,.qt,.pn,.hh,.eh{font-family:Fredoka,Inter,sans-serif}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;border:2px solid #fff;box-shadow:0 0 0 1px #0003}
/* setup */
#setup{position:fixed;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 16px;background:#0b3b44}
.sbg{position:fixed;inset:-30px;background:url(board34p.jpg) center/cover;filter:blur(6px) saturate(1.1) brightness(.55)}
.sbg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 20%,#06262ecc 85%)}
.fan{position:relative;height:150px;width:100%;max-width:560px;z-index:1;margin-bottom:-40px;pointer-events:none}
.fan img{position:absolute;left:50%;top:0;width:98px;border-radius:7px;box-shadow:0 10px 24px #0008;transform:translateX(calc(-50% + var(--x))) translateY(var(--y)) rotate(var(--r));transform-origin:50% 120%;animation:fanin .8s cubic-bezier(.2,.8,.2,1) both}
.fan img:nth-child(2){animation-delay:.05s}.fan img:nth-child(3){animation-delay:.1s}.fan img:nth-child(4){animation-delay:.15s}.fan img:nth-child(5){animation-delay:.2s}
@keyframes fanin{from{opacity:0;transform:translateX(-50%) translateY(60px) rotate(0)}}
.sbox{position:relative;z-index:2;width:100%;max-width:500px;background:linear-gradient(#fffaf0,#f3e6cc);border-radius:22px;padding:56px 30px 26px;box-shadow:0 24px 60px #000a,inset 0 0 0 3px #d8c49a;text-align:center}
.sbox h1{margin:0;font:600 64px/1 Fredoka,sans-serif;color:#1f6f78;letter-spacing:1px;text-shadow:0 3px 0 #f1d27a,0 6px 14px #0003}
.sub{margin:6px 0 18px;color:#8a7a5f;font-size:13px}
.sect{font:600 13px Fredoka,sans-serif;text-transform:uppercase;letter-spacing:1.5px;color:#9a8460;margin:16px 0 8px}
.seg{display:inline-flex;background:#e7d6b4;border-radius:14px;padding:4px;gap:4px}
.seg button{font:600 16px Fredoka,sans-serif;border:0;background:transparent;color:#6b5a3e;border-radius:10px;padding:9px 18px;cursor:pointer;transition:.15s}
.seg button:hover{background:#f6ead3}
.seg button.on{background:#1f8a8a;color:#fff;box-shadow:0 3px 0 #13605f}
#npseg button{min-width:58px;font-size:20px}
.seat{display:flex;gap:10px;align-items:center;margin:8px auto;max-width:400px;background:#fff;border-radius:14px;padding:7px 9px 7px 7px;box-shadow:0 2px 0 #dcc9a3}
.seat .stok{width:34px;height:34px;flex:none;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--c) 70%,white),var(--c) 70%);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,black),0 5px 6px #0004;display:grid;place-items:center}
.seat .stok img{width:62%}
.seat .stok{cursor:pointer;transition:transform .15s;position:relative}.seat .stok:hover{transform:scale(1.12) rotate(-8deg)}
.seat .stok::after{content:'⟳';position:absolute;right:-5px;bottom:-5px;width:15px;height:15px;border-radius:50%;background:#fff;color:#6b5a3e;font-size:11px;line-height:15px;box-shadow:0 1px 3px #0005}
.colhint{font-size:11px;color:#a39274;margin-top:-2px}
.seat input{flex:1;min-width:0;border:0;background:transparent;font:600 16px Fredoka,sans-serif;color:#3a3226;padding:6px}
.seat input:focus{outline:2px solid #1f8a8a55;border-radius:8px}
.seat .seg{padding:3px}.seat .seg button{font-size:13px;padding:6px 11px}
#go{display:block;width:100%;margin:22px 0 0;border:0;border-radius:16px;padding:16px;font:600 22px Fredoka,sans-serif;color:#fff;cursor:pointer;background:linear-gradient(#f2a33a,#e07b1f);box-shadow:0 5px 0 #a8550f,0 10px 20px #0003;transition:.12s}
#go:hover{transform:translateY(-2px);box-shadow:0 7px 0 #a8550f,0 14px 24px #0003}
#go:active{transform:translateY(3px);box-shadow:0 2px 0 #a8550f}
.soon{margin-top:12px;font-size:12px;color:#a39274}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
.ob{font:inherit;cursor:pointer;border:1px solid #c9b994;background:#fff;border-radius:10px;padding:8px 12px;text-align:left;transition:.12s}
.ob:hover{background:#fff3d6;border-color:#b0965c}
.note{font-size:12px;color:var(--muted);margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
/* game */
#game{display:none;height:100vh;gap:10px;padding:10px}
#left{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0}
#lscroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;border-radius:12px}
#right{width:360px;flex:none;display:flex;flex-direction:column;gap:8px;min-height:0}
#boardwrap{position:relative;width:100%;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px #0002;flex:none}
#boardimg{width:100%;display:block}
#overlay{position:absolute;inset:0}
.tok{position:absolute;transform:translate(-50%,-50%);pointer-events:auto}
.chick{--cd:color-mix(in srgb,var(--c) 62%,black);width:1.3%;aspect-ratio:1;border-radius:12%;background:var(--ico) center/78% no-repeat,linear-gradient(135deg,color-mix(in srgb,var(--c) 85%,white),var(--c));box-shadow:.12vw .16vw 0 var(--cd),.2vw .26vw 0 var(--cd),.3vw .4vw .4vw #0007}
.wood{--cd:color-mix(in srgb,var(--c) 60%,black);border-radius:50%;background:var(--ico) center/66% no-repeat,radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--c) 75%,white),var(--c) 70%)}
.tree{width:2.3%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6,transparent 40%),var(--c);border:3px solid #fff;box-shadow:0 2px 4px #0006}
.tree::after{content:"🌳";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(8px,1vw,18px)}
.treeinfo{width:2.4%;aspect-ratio:1;border-radius:50%;cursor:help}
.bld{width:2.3%;aspect-ratio:1;box-shadow:0 .12vw 0 var(--cd),0 .24vw 0 var(--cd),0 .36vw 0 var(--cd),0 .5vw .5vw #0008}
.flock{width:2.1%;aspect-ratio:1;box-shadow:0 .15vw 0 var(--cd),0 .3vw 0 var(--cd),0 .45vw 0 var(--cd),0 .6vw 0 var(--cd),0 .75vw 0 var(--cd),0 .9vw 0 var(--cd),0 1.05vw .6vw #0008;transform:translate(-50%,-80%)!important}
.settle{line-height:0}.settle .st3{width:clamp(14px,2vw,30px)!important;height:clamp(14px,2vw,30px)!important}
.settle.taken{line-height:0;border-radius:50%;padding:2px;background:var(--c);box-shadow:0 0 0 2px #fff,0 1px 4px #0008}
.settle.taken .st3{width:clamp(12px,1.5vw,24px)!important;height:clamp(12px,1.5vw,24px)!important}
.settle.taken:empty{width:1.4%;aspect-ratio:1}
.st3{display:inline-block;vertical-align:-2px;filter:drop-shadow(0 1px 0 #9a6a08) drop-shadow(0 1px 0 #8a5c06) drop-shadow(0 1px 0 #7a5005) drop-shadow(0 2px 2px #0007);margin-right:1px}

.stars{display:inline-flex;gap:1px;align-items:center}
.pres{display:flex;gap:2px}
.pres i{font-style:normal;color:#fff;font:600 clamp(7px,.7vw,11px) Inter;min-width:1.2em;text-align:center;border-radius:4px;padding:0 2px;border:1px solid #fff}
.rowcard{width:8.2%}
.target{width:2.6%;aspect-ratio:1;border-radius:50%;border:3px solid #ffef3a;box-shadow:0 0 0 3px #0008,0 0 14px #ffef3a;cursor:pointer;animation:pulse 1.2s infinite}
.target.big{width:3.6%}
.target.rowt{width:8.8%;aspect-ratio:auto;height:22%;border-radius:10px}
.target.sel{background:#ffef3a88}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.12)}}
/* cartes */
.card{--fam:#888;background:#fffdf8;border:2px solid var(--fam);border-radius:8px;overflow:hidden;font-size:11px;position:relative;text-align:left;color:var(--ink)}
.card .ch{background:var(--fam);color:#fff;display:flex;gap:6px;align-items:center;padding:3px 5px}
.card .cost{background:#3a2a1a;color:#fff;border-radius:4px;padding:0 5px;font:600 13px Fredoka}
.card .cn{font:600 12px Fredoka;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ctag{padding:2px 5px;color:var(--fam);font-size:12px}
.card .ctag span{font-size:10px;color:var(--muted)}
.card .cfx{padding:0 5px 3px}
.card .fx{margin:2px 0}
.card .cpay{font-size:9.5px;color:var(--muted);padding:2px 5px;border-top:1px dashed #ddd}
.card.mini{font-size:clamp(5px,.55vw,9px);border-width:1.5px}
.card.mini .ch{padding:1px 3px}.card.mini .cn{font-size:clamp(6px,.65vw,11px)}.card.mini .cost{font-size:clamp(7px,.7vw,12px)}
.card.mini .ctag{font-size:clamp(6px,.6vw,10px);padding:0 3px}.card.mini .cfx{padding:0 3px}.card.mini .cpay{display:none}
.card.mid{width:150px;flex:none}
.card.big{width:240px;font-size:13px}.card.big .cn{font-size:15px}
.card .ds{position:absolute;left:50%;top:34%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:0;width:80%;filter:drop-shadow(0 2px 2px #0008)}
.card .ds img{height:30px!important;width:auto!important;margin:0 -3px;display:inline-block}
.card .ds b{background:#c98a12;color:#fff;border-radius:6px;padding:0 5px;align-self:center;margin-left:4px}
  .card.img{border:0;background:transparent;border-radius:6%/4%;overflow:hidden;box-shadow:0 1px 4px #0004}
.card.img img{width:100%;display:block}
.wt{outline:1px solid #0005;--cd:#b9b2a6!important}
.ico.wt,.ico[style*='#ffffff']{outline:1px solid #0004}
.nests{display:flex;align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap}
.nestbox{display:inline-flex;gap:3px;padding:4px 6px;border-radius:14px;background:#d9c39a;box-shadow:inset 0 0 0 2px #a8875a}
.eslot{width:18px;height:22px;border-radius:50%/55% 55% 45% 45%;border:1.5px dashed #8a6d45;display:inline-block}
.eslot.full{border:0;background:var(--i) center/70% no-repeat,var(--c);box-shadow:1px 2px 0 color-mix(in srgb,var(--c) 60%,black)}
.shade{position:absolute;background-size:100% 100%;opacity:.5;pointer-events:none;transition:opacity .2s}
#pchoice{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#0b2a3055;backdrop-filter:blur(1.5px)}
.pcbox{background:linear-gradient(#fffaf0,#f3e6cc);border-radius:18px;padding:16px 20px 12px;box-shadow:0 18px 50px #0009,inset 0 0 0 3px #d8c49a;text-align:center;max-width:92%}
.pct{font:600 19px Fredoka,sans-serif;color:#2b2a27}.pcsub{font-size:12px;color:#7b6a50;margin:4px 0 12px;max-width:520px}
.pcards{display:flex;gap:22px;justify-content:center}
.pcard{border:0;background:none;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.15s}
.pcard img{width:clamp(120px,13vw,200px);border-radius:10px;box-shadow:0 6px 16px #0006}
.pcard span{font:600 15px Fredoka,sans-serif;color:#2b2a27;display:flex;flex-direction:column}.pcard small{font:12px Inter,sans-serif;color:#7b6a50}
.pcard:hover{transform:translateY(-6px) scale(1.04)}.pcard:hover img{box-shadow:0 0 0 4px #f2a33a,0 12px 24px #0006}
.pchint{font-size:11px;color:#9a8a6e;margin-top:8px}
.opts.main{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-width:760px}
.actb{font:600 13px Fredoka,Inter,sans-serif;border:2px solid #d8c49a;background:#fffaf0;border-radius:14px;padding:10px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:.12s;color:#2b2a27}
.actb img{width:54px;height:54px;object-fit:contain}.actb img.dsic{width:40px;height:auto;border-radius:4px}
.actb:hover{border-color:#f2a33a;transform:translateY(-2px);box-shadow:0 4px 0 #e0c793}
.actb.off{opacity:.45;cursor:not-allowed;filter:grayscale(.7)}.actb.off:hover{transform:none;box-shadow:none;border-color:#d8c49a}
.actb small{font:400 10.5px Inter,sans-serif;color:#8a7a5f}
.mvic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--c) 70%,white),var(--c) 70%);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,black)}
.mvic img{width:62%!important;height:auto!important}
.obi{height:20px;vertical-align:-5px;margin-right:5px}
.bico{display:inline-block;width:22px;height:22px;vertical-align:-6px;margin-right:7px;box-shadow:0 2px 0 var(--cd),0 3px 3px #0005}
.pboard{position:relative;max-width:900px;margin:6px 0 4px}
.pbimg{width:100%;display:block}
.pbt{position:absolute;transform:translate(-50%,-50%)}
.pbw{width:6%;aspect-ratio:1;box-shadow:0 .25vw 0 var(--cd),0 .45vw 0 var(--cd),0 .6vw .5vw #0007}
.pbegg{width:2.6%;aspect-ratio:.8;border-radius:50%/58% 58% 42% 42%;background:var(--i) center/72% no-repeat,var(--c);box-shadow:1px 2px 0 color-mix(in srgb,var(--c) 60%,black),0 2px 4px #0005}
.pbegg.wt{outline:1px solid #0005}
.pbamu img{width:clamp(22px,3.4vw,44px);filter:drop-shadow(0 2px 2px #0006)}
.pbstar .st3{width:clamp(16px,2.7vw,34px)!important;height:clamp(16px,2.7vw,34px)!important}
.pbchick{--cd:color-mix(in srgb,var(--c) 62%,black);width:2.6%;aspect-ratio:1;border-radius:14%;background:var(--ico) center/78% no-repeat,linear-gradient(135deg,color-mix(in srgb,var(--c) 85%,white),var(--c));box-shadow:2px 3px 0 var(--cd),0 3px 5px #0006}
.pbn{background:#2b2a27;color:#fff;font:600 12px Fredoka,Inter,sans-serif;border-radius:9px;padding:0 7px}
.pboard.hasrel{margin-bottom:clamp(80px,12vw,150px)}
.pbrel{position:absolute;top:99.5%;transform:translateX(-50%);display:flex;gap:4px;align-items:flex-start;z-index:-0;width:21%;justify-content:center;flex-wrap:wrap}
.pboard .pbimg{position:relative;z-index:1}.pboard .pbt{z-index:2}
.relc{position:relative;flex:1 1 45%;max-width:90%;aspect-ratio:400/236;overflow:hidden;border-radius:0 0 7px 7px;box-shadow:0 3px 6px #0005;cursor:help}
.relc>img{position:absolute;bottom:0;left:0;width:100%}
.relc .ds{position:absolute;right:2px;top:2px;display:flex}.relc .ds img{height:16px;margin-left:-4px}
.relfree{width:100%;text-align:center;font-size:10px;color:#9a8a6e;margin-top:2px}
.pboard.hasobj{margin-top:20%}
.pbobj{position:absolute;left:15%;bottom:98.5%;width:18.3%;aspect-ratio:614/680;overflow:hidden;border-radius:10px 10px 0 0;box-shadow:0 -2px 8px #0003;z-index:0;cursor:help}
.pbobj img{width:100%;display:block}
.ptag{height:16px;vertical-align:-4px;margin:0 1px}
